# 每日定时：抓取安全工程招聘信息 -> 更新数据 -> 生成网页
name: daily-job-update

on:
  schedule:
    # 北京时间 11:00 = UTC 03:00（用户指定更新时间）
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Playwright（真实浏览器过 JS 挑战）
        run: |
          pip install --quiet playwright
          python -m playwright install chromium --with-deps

      - name: 抓取并更新（云端只跑反爬友好的源，智联留本地）
        id: scrape
        run: |
          python run.py --backend playwright --pages 2 --sources iguopin,yjs,chern
        continue-on-error: false

      - name: 提交更新
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@github.com"
          git add data docs logs
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "daily update $(date +'%Y-%m-%d')"
            git push
          fi

      - name: 抓取失败自动开 Issue 通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## ⚠️ 今日云端抓取失败
            GitHub Actions 在抓取智联招聘时被反爬拦截（数据中心 IP 常见问题）。

            **补救方式**：在电脑上手动运行一次本地抓取：
            \`\`\`powershell
            cd E:\\\\work space\\\\safety-job-hunter
            python run.py --backend chrome_dump
            \`\`\`
            或直接运行 \`run_local.bat\`。本地家庭宽带 IP 成功率远高于云端。`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 云端抓取失败 ${new Date().toISOString().slice(0,10)}`,
              body: body
            });
